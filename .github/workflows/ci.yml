name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.50.0"
          cache: true
      - run: flutter pub get
      # Format check runs before code generation so it covers hand-written code only.
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter analyze
      - run: flutter test -r failures-only
      - run: flutter build apk --debug

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Apply migrations and run access-rule checks
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql >/dev/null
          sudo chmod -R a+rX "$GITHUB_WORKSPACE"
          sudo -u postgres env PATH="$(dirname "$(ls /usr/lib/postgresql/*/bin/initdb | tail -n 1)"):$PATH" bash supabase/tests/run_local.sh | tee result.txt
          grep -q "ALL CHECKS PASSED" result.txt
