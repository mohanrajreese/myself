<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F1514"/>
      <stop offset="100%" stop-color="#141E1C"/>
    </linearGradient>
    <linearGradient id="praxisTealGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5EC9BD"/>
      <stop offset="50%" stop-color="#14B8A6"/>
      <stop offset="100%" stop-color="#0F766E"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Canvas -->
  <rect width="512" height="512" rx="128" fill="url(#bgGradient)"/>
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="url(#praxisTealGradient)" stroke-width="2" stroke-opacity="0.3"/>

  <!-- Glowing background aura -->
  <circle cx="270" cy="220" r="110" fill="#0F766E" opacity="0.25" filter="url(#glow)"/>

  <!-- Praxis P Monogram / Habit Loop -->
  <g filter="url(#glow)">
    <!-- Vertical Pillar Stem -->
    <path d="M 170 128 L 170 384"
          fill="none"
          stroke="url(#praxisTealGradient)"
          stroke-width="34"
          stroke-linecap="round"/>

    <!-- Dynamic Cyclical Habit Arc of 'P' -->
    <path d="M 170 128 C 290 120, 360 150, 360 216 C 360 282, 290 304, 170 304"
          fill="none"
          stroke="url(#praxisTealGradient)"
          stroke-width="34"
          stroke-linecap="round"
          stroke-linejoin="round"/>

    <!-- Intentional Core Focus Point -->
    <circle cx="260" cy="216" r="20" fill="#5EC9BD"/>
  </g>
</svg>
